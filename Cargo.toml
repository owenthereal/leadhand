[package]
name = "leadhand"
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
# Compiles in the test hooks, honoured only with LEADHAND_TESTING=1. Release builds leave it off.
testing = []

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
signal-hook = "0.4.6"
toml = "1.2.1"

# The macOS process-table calls; and, on both: the runner's SIGHUP set to SIG_IGN and the
# close-on-exec marking of inherited descriptors (rulings S2-R37, S2-R38), and the launcher's
# SIGINT/SIGTERM forwarding handler, installed and restored with sigaction, with the errno it
# keeps (ruling S2-R40).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"

# The fake `codex` and `claude` the integration tests run (tests/common), built only with the
# testing feature, so the release package still ships one binary.
[[bin]]
name = "leadhand-fake-codex"
path = "tests/fakes/codex.rs"
required-features = ["testing"]

[[bin]]
name = "leadhand-fake-claude"
path = "tests/fakes/claude.rs"
required-features = ["testing"]
