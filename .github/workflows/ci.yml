name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      # Each platform reports its own result.
      fail-fast: false
      matrix:
        # macOS arm64, Linux x86_64, Linux arm64.
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All history, so that git diff --check can compare the change with its base.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust 1.99
        run: |
          rustup toolchain install 1.99 --profile minimal --component clippy,rustfmt
          rustup default 1.99

      # For `claude plugin validate --strict .`, which needs no login. Kept off PATH for the
      # tests, which use the fakes in tests/fakes.
      - name: Install Claude Code
        run: npm install --prefix "$RUNNER_TEMP/claude-code" --no-audit --no-fund @anthropic-ai/claude-code@2.1.325

      - name: Show tool versions
        run: |
          uname -m
          rustc --version
          cargo --version
          git --version
          "$RUNNER_TEMP/claude-code/node_modules/.bin/claude" --version

      # Hygiene
      - name: git diff --check against the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE" HEAD
      # The hygiene grep. One character of each name is bracketed, which matches the same text,
      # so that this file, which the grep covers, doesn't match itself.
      - name: Hygiene grep
        run: |
          ! grep -rnE '[O]wen|/Users/[o]wen|agent[-]docs|pipeline[/]' agents skills presets templates docs .claude-plugin .codex-plugin bin scripts src tests .github

      # Build
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: cargo build --locked --release
      - run: cargo clippy --locked --all-targets --features testing -- -D warnings
      - name: claude plugin validate --strict .
        run: |
          PATH="$RUNNER_TEMP/claude-code/node_modules/.bin:$PATH"
          claude plugin validate --strict .

      # Tests. The contract tests (tests/*.rs) run against the testing build; tests/plugin_files.rs
      # also checks the manifests. Measured locally on a developer Mac, the suite took about seven
      # minutes; the cap bounds a hang.
      - run: cargo test --locked --features testing
        timeout-minutes: 45
      # Without the feature: checks that the test hooks are compiled out.
      - run: cargo test --locked --lib
        timeout-minutes: 15
